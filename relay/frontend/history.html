<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relay - Session History</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    <div class="max-w-4xl mx-auto w-full p-4">
        <header class="mb-6 flex items-center justify-between">
            <div>
                <h1 class="text-3xl font-bold text-white">Relay</h1>
                <p class="text-gray-400">Session History</p>
            </div>
            <a href="/" class="text-sm text-blue-400 hover:text-blue-300 underline">New session</a>
        </header>

        <div id="loading" class="text-center py-12 text-gray-400">
            Loading sessions...
        </div>

        <div id="sessions-list" class="hidden space-y-3">
        </div>

        <div id="empty-state" class="hidden text-center py-12 text-gray-500">
            No sessions yet. <a href="/" class="text-blue-400 hover:underline">Start a new one</a>.
        </div>
    </div>

    <script>
        const loadingEl = document.getElementById('loading');
        const listEl = document.getElementById('sessions-list');
        const emptyEl = document.getElementById('empty-state');

        function formatDate(isoString) {
            if (!isoString) return '—';
            const date = new Date(isoString);
            return date.toLocaleString(undefined, {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function truncate(text, maxLen = 80) {
            if (!text) return '—';
            return text.length > maxLen ? text.slice(0, maxLen) + '…' : text;
        }

        function getStatusBadge(status) {
            if (status === 'running') {
                return '<span class="px-2 py-0.5 text-xs font-medium bg-green-900/30 text-green-400 rounded">Running</span>';
            }
            return '<span class="px-2 py-0.5 text-xs font-medium bg-gray-700 text-gray-400 rounded">Completed</span>';
        }

        async function deleteSession(sessionId, cardElement) {
            if (!confirm('Delete this session? This cannot be undone.')) return;
            try {
                const res = await fetch(`/api/sessions/${sessionId}`, { method: 'DELETE' });
                if (res.ok) {
                    cardElement.remove();
                    // Check if list is now empty
                    if (listEl.children.length === 0) {
                        listEl.classList.add('hidden');
                        emptyEl.classList.remove('hidden');
                    }
                } else {
                    alert('Failed to delete session');
                }
            } catch (err) {
                console.error(err);
                alert('Failed to delete session: ' + err.message);
            }
        }

        async function loadSessions() {
            try {
                const res = await fetch('/api/sessions');
                const sessions = await res.json();

                loadingEl.classList.add('hidden');

                if (!sessions || sessions.length === 0) {
                    emptyEl.classList.remove('hidden');
                    return;
                }

                listEl.classList.remove('hidden');
                listEl.innerHTML = '';

                sessions.forEach(session => {
                    const card = document.createElement('div');
                    card.className = 'p-4 bg-gray-800 rounded-lg border border-gray-700 hover:border-blue-600 transition-colors';
                    card.innerHTML = `
                        <div class="flex items-start justify-between gap-4">
                            <a href="/session/${session.id}" class="flex-1 min-w-0">
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="font-mono text-sm text-gray-400">${session.id.slice(0, 8)}…</span>
                                    ${getStatusBadge(session.status)}
                                </div>
                                <p class="text-gray-300 font-mono text-sm mb-2">${truncate(session.task, 100)}</p>
                                <div class="flex items-center gap-4 text-xs text-gray-500">
                                    <span>Owner: <span class="text-gray-300">${session.owner_id || '—'}</span></span>
                                    <span>Created: <span class="text-gray-300">${formatDate(session.created_at)}</span></span>
                                </div>
                            </a>
                            <button class="delete-btn px-2 py-1 text-sm text-red-400 hover:text-red-300 hover:bg-red-900/20 rounded transition-colors flex-shrink-0"
                                    data-session-id="${session.id}">
                                Delete
                            </button>
                        </div>
                    `;
                    // Attach delete handler directly (closure captures `card` and `session.id`)
                    card.querySelector('.delete-btn').addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        deleteSession(session.id, card);
                    });
                    listEl.appendChild(card);
                });
            } catch (err) {
                console.error(err);
                loadingEl.textContent = 'Failed to load sessions';
                loadingEl.classList.add('text-red-400');
            }
        }

        loadSessions();
    </script>
</body>
</html>
